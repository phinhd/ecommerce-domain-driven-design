services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ECommerceDb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ECommerceDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./ecommerce.aspnet
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      # Local-only values. Use a secret store (user-secrets, Key Vault, CI secrets) for real deployments.
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ECommerceDb;Username=admin;Password=password123
      - JwtSettings__SecretKey=docker-compose-dev-secret-key-0123456789abcdef
      - Database__ApplyMigrationsOnStartup=true
      - Seed__SampleData=true
      - AdminSeedSettings__Email=admin@ecommerce.local
      - AdminSeedSettings__Password=AdminPassword123!
      - Cors__AllowedOrigins__0=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data: