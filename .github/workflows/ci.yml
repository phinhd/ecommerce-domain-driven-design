name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce.aspnet
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ECommerce.slnx

      - name: Build (warnings as errors)
        run: dotnet build ECommerce.slnx -c Release --no-restore

      - name: Check formatting
        run: dotnet format ECommerce.slnx --verify-no-changes --no-restore --severity warn

      - name: Test (unit + Testcontainers integration)
        run: >
          dotnet test ECommerce.slnx -c Release --no-build
          --logger "trx" --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Summarise test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for f in sorted(glob.glob("TestResults/*.trx")):
              c = ET.parse(f).getroot().find(".//t:Counters", ns)
              if c is not None:
                  print(f"::notice title=Tests::{c.get('total')} total, {c.get('passed')} passed, {c.get('failed')} failed")
          PY

      - name: Report failed tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for f in glob.glob("TestResults/*.trx"):
              root = ET.parse(f).getroot()
              for r in root.iterfind(".//t:UnitTestResult", ns):
                  if r.get("outcome") == "Failed":
                      msg = r.findtext(".//t:Message", default="", namespaces=ns).replace("\n", " ")[:900]
                      print(f"::error title={r.get('testName')}::{msg}")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: ecommerce.aspnet/TestResults

  frontend:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce.react
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ecommerce.react/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -t ecommerce-api:ci ecommerce.aspnet
